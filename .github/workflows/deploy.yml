name: Deploy slim JSONs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodules — scripts/ isn't public-facing.

      - name: Stage hosted files
        run: |
          mkdir -p _site
          cp -r kbs mbc _site/
          # Landing page (English intro) at the site root + its screenshots.
          cp index.html _site/index.html
          cp -r shots _site/shots
          # CNAME pins the custom subdomain (nightreplays.nvis.io); .nojekyll
          # disables Jekyll so directories named like Jekyll specials don't trip
          # the processor.
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          # Universal Links: the iOS app (Night Replays) opens
          # https://nightreplays.nvis.io/listen/?p=…&d=… in-app. AASA must be
          # reachable at both /.well-known/ and root; the listen page is the
          # no-app fallback. .nojekyll above keeps the dot-directory served.
          mkdir -p _site/.well-known _site/listen
          cp apple-app-site-association _site/.well-known/apple-app-site-association
          cp apple-app-site-association _site/apple-app-site-association
          cp listen/index.html _site/listen/index.html
          cp og.png _site/og.png
          # Privacy policy at /privacy (App Store Connect privacy policy URL)
          # and Terms of Use at /terms (App Store Connect EULA / Terms URL).
          mkdir -p _site/privacy _site/terms
          cp privacy/index.html _site/privacy/index.html
          cp terms/index.html _site/terms/index.html
          # Coverage dashboard at /status.html — fetches manifest.json which
          # we generate here so it's always in sync with the deployed JSONs.
          cp status.html _site/status.html
          python3 -c "
          import json, os, re
          # Per-date stats power the heatmap opacity in status.html — each
          # entry is [matched, total] where matched counts songs with an
          # appleMusicId. Stays compact: ~25 bytes/date.
          out = {'kbs': [], 'mbc': [], 'kbsStats': {}, 'mbcStats': {}}
          for program in ('kbs', 'mbc'):
              d = os.path.join('_site', program)
              if not os.path.isdir(d):
                  continue
              dates, stats = [], {}
              for f in sorted(os.listdir(d)):
                  m = re.match(r'^(\d{8})\.json$', f)
                  if not m:
                      continue
                  date = m.group(1)
                  dates.append(date)
                  try:
                      with open(os.path.join(d, f), encoding='utf-8') as fp:
                          songs = json.load(fp).get('songs', [])
                      stats[date] = [
                          sum(1 for s in songs if s.get('appleMusicId')),
                          len(songs),
                      ]
                  except (OSError, json.JSONDecodeError):
                      pass
              out[program] = dates
              out[program + 'Stats'] = stats
          with open('_site/manifest.json', 'w') as f:
              json.dump(out, f)
          print(f\"manifest: kbs={len(out['kbs'])} mbc={len(out['mbc'])}\")
          "
          echo "Staged $(find _site -name '*.json' | wc -l) JSON files"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
